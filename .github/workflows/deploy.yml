name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Build lại mỗi tuần để trang lịch theo ngày, ngày tốt theo tháng luôn tính từ thời điểm hiện tại
  schedule:
    - cron: "17 17 * * 0"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: node --test tests/*.test.js
      - name: Build
        # Địa chỉ trang (biến SITE_URL trong Variables nếu muốn đổi)
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://tinhgium.vn' }}
          # Mã Cloudflare Web Analytics (Settings > Secrets and variables > Actions > Variables > CF_BEACON_TOKEN)
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          # Địa chỉ bộ đếm lượt xem, ví dụ https://luot-xem.<tên>.workers.dev (Variables > COUNTER_URL)
          COUNTER_URL: ${{ vars.COUNTER_URL }}
        run: python3 build.py
      - name: Check every commune page against the dataset and source documents
        # trang /dia-chi-moi/<tỉnh>/<xã>/ khớp data/hanh-chinh, toàn văn nghị quyết và phụ lục vùng lương (khoảng 30 giây)
        run: python3 tools/hanh_chinh/spot_check_pages.py 100000 > page-check.txt || { grep -B3 '!!' page-check.txt; exit 1; }; tail -1 page-check.txt
      - name: IndexNow (find changed pages)
        id: indexnow
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://tinhgium.vn' }}
        # Danh sách URL đã đổi (có thể vài nghìn) đi qua tệp, không qua biến: biến môi trường tối đa 128 KB
        run: python3 tools/indexnow.py prepare dist "$SITE_URL" indexnow-urls.json
      - name: Keep the changed-URL list for the IndexNow job
        if: steps.indexnow.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.json
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  # Báo cho Bing và các công cụ tìm kiếm dùng IndexNow những trang vừa đổi (sau khi trang đã lên mạng)
  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: indexnow-urls
      - name: Tell Bing which pages changed (IndexNow)
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://tinhgium.vn' }}
        run: python3 tools/indexnow.py submit "$SITE_URL" @indexnow-urls.json site/static
