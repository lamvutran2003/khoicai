description: Sửa chữ lỗi font kiểu "Hµ Néi", "Haø Noäi" thành tiếng Việt Unicode. Tự nhận TCVN3 (.VnTime) hay VNI-Times, chuyển cả file Word .docx giữ nguyên định dạng. Không cần Unikey.

<div class="tool">
  <div class="field">
    <label class="label" for="src">Văn bản lỗi font</label>
    <textarea class="area" id="src" spellcheck="false" placeholder="Dán chữ vào đây"></textarea>
  </div>
  <div class="row">
    <span class="opt">Bảng mã
      <select id="enc" aria-label="Bảng mã nguồn">
        <option value="auto">Tự nhận</option><option value="TCVN3">TCVN3 (.VnTime)</option><option value="VNI">VNI (VNI-Times)</option>
      </select></span>
    <span class="pill" id="det" aria-live="polite" hidden></span>
  </div>
  <div class="field">
    <label class="label" for="dst">Unicode</label>
    <textarea class="area" id="dst" readonly></textarea>
    <div class="actions"><button class="btn primary" type="button" data-copy-from="dst">Sao chép</button></div>
  </div>
  <label class="drop" id="drop">
    <input type="file" id="file" accept=".docx">
    <b>Hoặc thả file Word (.docx) vào đây</b>
    <span class="note">Nhận lại file đã chuyển, giữ nguyên định dạng.</span>
  </label>
  <div class="out" id="fileOut" hidden aria-live="polite">
    <div class="text" id="fileMsg"></div>
    <div class="actions" id="fileActions"></div>
  </div>
</div>

<div class="article">
  <h2>Chữ lỗi font trông như thế nào?</h2>
  <div class="scroll"><table class="t">
    <thead><tr><th>Font cũ</th><th>Bị lỗi</th><th>Đúng</th></tr></thead>
    <tbody>
      <tr><td>TCVN3 (.VnTime, .VnArial)</td><td>Hµ Néi</td><td>Hà Nội</td></tr>
      <tr><td>VNI (VNI-Times)</td><td>Haø Noäi</td><td>Hà Nội</td></tr>
    </tbody>
  </table></div>
  <p class="note">File .doc cũ: mở bằng Word, lưu thành .docx rồi thả vào. File được xử lý ngay trên máy bạn, không tải lên mạng.</p>
</div>

<script src="/js/font-tables.js"></script>
<script src="/js/font-viet.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const NAMES = { TCVN3: "TCVN3", VNI: "VNI", NFC: "Unicode tổ hợp" };

  function render(){
    const s = $("src").value, det = $("det");
    let enc = $("enc").value;
    det.hidden = true;
    if (enc === "auto") {
      const d = FontViet.detect(s); enc = d.enc;
      if (s.trim()) {
        det.hidden = false; det.className = "pill" + (d.enc || d.reason === "unicode" ? "" : " warn");
        det.textContent = d.enc ? "Nhận ra: " + NAMES[d.enc] : d.reason === "unicode" ? "Đã là Unicode" : "Chưa nhận ra, chọn bảng mã";
      }
    }
    $("dst").value = enc ? FontViet.convert(s, enc) : s;
  }
  $("src").addEventListener("input", render); $("enc").addEventListener("change", render);

  function save(blob, name){
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  let zipLib = null;
  const loadZip = () => zipLib || (zipLib = new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = "/js/jszip.min.js"; s.onload = () => ok(window.JSZip); s.onerror = no; document.head.appendChild(s);
  }));
  function msg(text, err){ $("fileOut").hidden = false; $("fileMsg").textContent = text; $("fileMsg").className = "text" + (err ? " err" : ""); $("fileActions").innerHTML = ""; }

  async function handle(file){
    if (!file) return;
    if (!/\.docx$/i.test(file.name)) { msg(/\.doc$/i.test(file.name) ? "File .doc: mở bằng Word, lưu thành .docx rồi thả lại." : "Chỉ nhận file .docx.", true); return; }
    msg("Đang chuyển…");
    try {
      const JSZip = await loadZip(), zip = await JSZip.loadAsync(file);
      const sf = zip.file("word/styles.xml"), stylesXml = sf ? await sf.async("string") : "";
      const styles = FontViet.readStyles(stylesXml), stats = { runs: 0, chars: 0 };
      const parts = Object.keys(zip.files).filter(n => /^word\/(document|header\d*|footer\d*|footnotes|endnotes|comments)\.xml$/.test(n));
      for (const n of parts) zip.file(n, FontViet.convertDocxXml(await zip.file(n).async("string"), styles, stats));
      if (stylesXml) zip.file("word/styles.xml", FontViet.swapFonts(stylesXml));
      if (!stats.runs) { msg("Không thấy chữ dùng font .Vn… hay VNI-… trong file này.", true); return; }
      const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
      const name = file.name.replace(/\.docx$/i, "") + " (Unicode).docx";
      msg("Xong: " + name);
      const b = document.createElement("button"); b.className = "btn primary"; b.type = "button"; b.textContent = "Tải lại file";
      b.addEventListener("click", () => save(blob, name)); $("fileActions").appendChild(b); save(blob, name);
    } catch (e) { msg("Không mở được file này (file hỏng hoặc có mật khẩu).", true); }
  }
  $("file").addEventListener("change", e => { handle(e.target.files[0]); e.target.value = ""; });
  const drop = $("drop");
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => handle(e.dataTransfer.files[0]));
  render();
})();
</script>
