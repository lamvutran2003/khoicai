<div class="tool">
  <div class="row">
    <span class="seg" role="group" aria-label="Chiều đổi">
      <button type="button" data-mode="s2l" aria-pressed="true">Dương → Âm</button><button type="button" data-mode="l2s" aria-pressed="false">Âm → Dương</button>
    </span>
    <button class="chip" type="button" id="today">Hôm nay</button>
  </div>
  <div class="field">
    <label class="label" for="pIn" id="pLabel">Ngày dương lịch</label>
    <div class="dp" id="dp">
      <div class="dp-field">
        <input id="pIn" class="big" inputmode="numeric" autocomplete="off" placeholder="dd/mm/yyyy" aria-haspopup="dialog" aria-controls="pop">
        <button type="button" class="dp-btn" id="pBtn" aria-label="Mở lịch chọn ngày">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        </button>
      </div>
      <label class="chk" id="leapWrap" hidden><input type="checkbox" id="pLeap"> Tháng nhuận</label>
      <div class="pop" id="pop" role="dialog" aria-label="Chọn ngày" hidden>
        <div class="cal-head">
          <button class="btn" type="button" id="popPrev" aria-label="Tháng trước">‹</button>
          <b id="popTitle"></b>
          <button class="btn" type="button" id="popNext" aria-label="Tháng sau">›</button>
        </div>
        <div class="cal-grid small" id="popGrid"></div>
      </div>
    </div>
  </div>
  <div class="out" aria-live="polite">
    <div class="text" id="res"></div>
    <div class="note" id="sub"></div>
  </div>
  <div class="cal">
    <div class="cal-head">
      <button class="btn" type="button" id="prev" aria-label="Tháng trước">‹</button>
      <b id="calTitle"></b>
      <button class="btn" type="button" id="next" aria-label="Tháng sau">›</button>
    </div>
    <div class="cal-grid" id="grid"></div>
    <ul class="hols" id="hols"></ul>
  </div>
</div>

<div class="article">
  <h2>Tết Nguyên đán các năm</h2>
  <div class="scroll"><table class="t"><thead><tr><th>Năm</th><th>Mùng 1 Tết</th></tr></thead><tbody id="tet"></tbody></table></div>
  <p class="note">Ngày tô đỏ là ngày nghỉ lễ hưởng lương. Tết âm lịch được nghỉ 5 ngày và Quốc khánh 2 ngày; ngày nghỉ cụ thể do Chính phủ công bố mỗi năm. Lịch âm Việt Nam tính theo giờ Hà Nội (UTC+7) nên đôi khi lệch một ngày so với lịch Trung Quốc.</p>
</div>

<script src="/js/am-lich.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id), A = AmLich;
  const pad = n => String(n).padStart(2, "0");
  const now = new Date(), T = { day: now.getDate(), month: now.getMonth() + 1, year: now.getFullYear() };
  const todayJd = A.jdFromDate(T.day, T.month, T.year);
  const solarLen = (m, y) => A.jdFromDate(1, m === 12 ? 1 : m + 1, m === 12 ? y + 1 : y) - A.jdFromDate(1, m, y);
  const lunarName = m => m === 1 ? "giêng" : m === 12 ? "chạp" : String(m);
  const leadOf = jd => ((jd + 1) % 7 + 6) % 7;   // tuần bắt đầu từ thứ hai
  const DOW = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"].map(d => `<span class="dow">${d}</span>`).join("");
  let mode = "s2l", sel = { ...T }, view = { month: T.month, year: T.year }, pv = null;

  // One cell of a month grid, for the solar day jd. big/small: the two numbers shown.
  function cell(jd, big, small, extra){
    const d = A.jdToDate(jd), hs = A.holidays(d.day, d.month, d.year), off = hs.some(h => h.off);
    const selJd = A.jdFromDate(sel.day, sel.month, sel.year);
    const cls = [leadOf(jd) === 6 && "sun", jd === selJd && "sel", jd === todayJd && "today", off && "off", hs.length && !off && "ev", extra].filter(Boolean).join(" ");
    return `<button type="button" data-jd="${jd}" class="${cls}"${hs.length ? ` title="${hs.map(h => h.name).join(", ")}"` : ""}>${big}<small>${small}</small></button>`;
  }

  // ---- input field: shows the selected date in the calendar of the current mode
  function lunarOfSel(){ return A.toLunar(sel.day, sel.month, sel.year); }
  function showInput(){
    if (mode === "s2l") { $("pIn").value = `${pad(sel.day)}/${pad(sel.month)}/${sel.year}`; $("leapWrap").hidden = true; }
    else {
      const l = lunarOfSel(); $("pIn").value = `${pad(l.day)}/${pad(l.month)}/${l.year}`;
      $("leapWrap").hidden = !(A.leapMonthOf(l.year) === l.month); $("pLeap").checked = l.leap;
    }
  }
  function typed(){
    let v = $("pIn").value.replace(/\D/g, "").slice(0, 8);
    $("pIn").value = v.length > 4 ? `${v.slice(0, 2)}/${v.slice(2, 4)}/${v.slice(4)}` : v.length > 2 ? `${v.slice(0, 2)}/${v.slice(2)}` : v;
    if (v.length < 8) return;
    const d = +v.slice(0, 2), m = +v.slice(2, 4), y = +v.slice(4);
    if (!(y >= 1900 && y <= 2199 && m >= 1 && m <= 12 && d >= 1)) return;
    if (mode === "s2l") { if (d <= solarLen(m, y)) select({ day: d, month: m, year: y }, false); }
    else {
      $("leapWrap").hidden = A.leapMonthOf(y) !== m;
      const s = A.toSolar(d, m, y, !$("leapWrap").hidden && $("pLeap").checked);
      if (s) select(s, false);
    }
  }

  // ---- popup picker
  function openPop(){
    if (mode === "s2l") pv = { month: sel.month, year: sel.year };
    else { const l = lunarOfSel(); pv = { month: l.month, year: l.year, leap: l.leap }; }
    $("pop").hidden = false; drawPop();
  }
  const closePop = () => { $("pop").hidden = true; };
  function stepPop(k){
    if (mode === "s2l") { let m = pv.month + k, y = pv.year; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } pv = { month: m, year: y }; }
    else if (k > 0) {
      if (!pv.leap && A.leapMonthOf(pv.year) === pv.month) pv = { ...pv, leap: true };
      else { let m = pv.month + 1, y = pv.year; if (m > 12) { m = 1; y++; } pv = { month: m, year: y, leap: false }; }
    } else {
      if (pv.leap) pv = { ...pv, leap: false };
      else { let m = pv.month - 1, y = pv.year; if (m < 1) { m = 12; y--; } pv = { month: m, year: y, leap: A.leapMonthOf(y) === m }; }
    }
    drawPop();
  }
  function drawPop(){
    let html = DOW, first, n;
    if (mode === "s2l") {
      first = A.jdFromDate(1, pv.month, pv.year); n = solarLen(pv.month, pv.year);
      $("popTitle").textContent = `Tháng ${pv.month}/${pv.year}`;
      html += "<span></span>".repeat(leadOf(first));
      for (let i = 0; i < n; i++) { const l = A.toLunar(i + 1, pv.month, pv.year); html += cell(first + i, i + 1, l.day === 1 ? `${l.day}/${l.month}` : l.day); }
    } else {
      const s = A.toSolar(1, pv.month, pv.year, pv.leap); first = s.jd; n = A.monthLength(pv.month, pv.year, pv.leap);
      $("popTitle").textContent = `Tháng ${lunarName(pv.month)}${pv.leap ? " nhuận" : ""} năm ${A.canChiYear(pv.year)} (${pv.year})`;
      html += "<span></span>".repeat(leadOf(first));
      for (let i = 0; i < n; i++) { const d = A.jdToDate(first + i); html += cell(first + i, i + 1, `${d.day}/${d.month}`); }
    }
    $("popGrid").innerHTML = html;
  }

  // ---- selection, result, month calendar
  function select(s, refill){
    sel = { day: s.day, month: s.month, year: s.year }; view = { month: s.month, year: s.year };
    if (refill) showInput();
    if (!$("pop").hidden) openPop();   // khi đang gõ: lịch popup nhảy theo ngày vừa gõ
    render();
  }
  function render(){
    const jd = A.jdFromDate(sel.day, sel.month, sel.year), l = lunarOfSel();
    const lunar = `${l.day} tháng ${lunarName(l.month)}${l.leap ? " nhuận" : ""} năm ${A.canChiYear(l.year)}`;
    const solar = `${A.weekday(jd)}, ${sel.day}/${sel.month}/${sel.year}`;
    const hol = A.holidays(sel.day, sel.month, sel.year).map(h => h.name).join(", ");
    $("res").textContent = mode === "s2l" ? "Âm lịch: " + lunar : "Dương lịch: " + solar;
    $("sub").textContent = (mode === "s2l" ? solar : "Âm lịch " + lunar) + " · Ngày " + A.canChiDay(jd) + ", tháng " + A.canChiMonth(l.month, l.year) + (hol ? " · " + hol : "");
    drawCal();
  }
  function drawCal(){
    const { month, year } = view, first = A.jdFromDate(1, month, year), n = solarLen(month, year), list = [];
    $("calTitle").textContent = `Tháng ${month}/${year}`;
    let html = DOW + "<span></span>".repeat(leadOf(first));
    for (let i = 0; i < n; i++) {
      const l = A.toLunar(i + 1, month, year);
      A.holidays(i + 1, month, year).forEach(h => list.push(`<li class="${h.off ? "off" : ""}"><b>${i + 1}/${month}</b> ${h.name}${h.off ? " (nghỉ)" : ""}</li>`));
      html += cell(first + i, i + 1, l.day === 1 ? `${l.day}/${l.month}${l.leap ? "N" : ""}` : l.day, (l.day === 1 || l.day === 15) && "mark");
    }
    $("grid").innerHTML = html; $("hols").innerHTML = list.join("");
  }

  // ---- events
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("pLabel").textContent = mode === "s2l" ? "Ngày dương lịch" : "Ngày âm lịch";
    closePop(); showInput(); render();
  }));
  $("pIn").addEventListener("input", typed);
  $("pIn").addEventListener("focus", () => { if ($("pop").hidden) openPop(); });
  $("pIn").addEventListener("keydown", e => { if (e.key === "Escape") closePop(); if (e.key === "Enter") { closePop(); showInput(); } });
  $("pBtn").addEventListener("click", () => $("pop").hidden ? openPop() : closePop());
  $("pLeap").addEventListener("change", typed);
  $("popPrev").addEventListener("click", () => stepPop(-1)); $("popNext").addEventListener("click", () => stepPop(1));
  $("popGrid").addEventListener("click", e => { const b = e.target.closest("button[data-jd]"); if (!b) return; select(A.jdToDate(+b.dataset.jd), true); closePop(); });
  document.addEventListener("click", e => { if (!$("pop").hidden && !$("dp").contains(e.target)) { closePop(); showInput(); } });
  $("today").addEventListener("click", () => { closePop(); select(T, true); });
  $("grid").addEventListener("click", e => { const b = e.target.closest("button[data-jd]"); if (b) select(A.jdToDate(+b.dataset.jd), true); });
  const shift = k => { let m = view.month + k, y = view.year; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } view = { month: m, year: y }; drawCal(); };
  $("prev").addEventListener("click", () => shift(-1)); $("next").addEventListener("click", () => shift(1));

  $("tet").innerHTML = Array.from({ length: 6 }, (_, i) => T.year + i - 1).map(y => {
    const s = A.toSolar(1, 1, y, false);
    return `<tr><td>${y} (${A.canChiYear(y)})</td><td>${A.weekday(s.jd)}, ${s.day}/${s.month}/${s.year}</td></tr>`;
  }).join("");
  select(T, true);
})();
</script>
