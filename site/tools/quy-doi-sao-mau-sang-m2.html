<form class="calc" id="f" data-result="out">
  <label class="l" for="region">Vùng</label>
  <div><select id="region" class="in"><option value="bac">Bắc Bộ</option><option value="trung">Trung Bộ</option><option value="nam">Nam Bộ</option></select></div>
  <label class="l" for="namCong" id="congL" hidden>1 công bằng</label>
  <div id="congW" hidden><select id="namCong" class="in"><option value="1000">1.000 m² (công tầm nhỏ)</option><option value="1296">1.296 m² (công tầm lớn)</option></select></div>
  <label class="l" for="val">Diện tích</label>
  <div class="f"><input id="val" class="in w-m" inputmode="decimal" autocomplete="off" value="1"><select id="unit" class="in" aria-label="Đơn vị"></select></div>
  <div class="btns"><button class="go" type="submit">Tính __PLAY__</button><button class="clr" type="button" data-clear>Xoá</button></div>
</form>

<section class="result" id="out" hidden aria-live="polite">
  <h2>Kết quả</h2>
  <div class="body">
    <p class="big" id="res"></p>
    <div class="scroll"><table class="t"><tbody id="tbl"></tbody></table></div>
  </div>
</section>

<div class="article">
  <h2>Bảng quy đổi</h2>
  <div class="scroll"><table class="t">
    <thead><tr><th></th><th>Bắc Bộ</th><th>Trung Bộ</th><th>Nam Bộ</th></tr></thead>
    <tbody>
      <tr><td>1 thước</td><td class="n">24 m²</td><td class="n">≈ 33 m²</td><td>–</td></tr>
      <tr><td>1 sào</td><td class="n">360 m²</td><td class="n">497 m²</td><td>–</td></tr>
      <tr><td>1 mẫu</td><td class="n">3.600 m²</td><td class="n">4.970 m²</td><td>–</td></tr>
      <tr><td>1 công</td><td>–</td><td>–</td><td class="n">1.000 m² (tầm nhỏ)<br>1.296 m² (tầm lớn)</td></tr>
    </tbody>
  </table></div>
  <p class="note">1 ha = 10.000 m². Sổ đỏ ghi diện tích bằng m²; khi mua bán nên chốt theo m².</p>
</div>

<script src="/js/so-nhap.js"></script>
<script src="/js/dat-dai.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id), F = DatDai.fmt;
  const nm = u => u.name.replace(/ \(.*\)/, "");
  try { const s = JSON.parse(localStorage.getItem("kc-dd") || "{}"); if (s.region) $("region").value = s.region; if (s.namCong) $("namCong").value = String(s.namCong); } catch (e) {}
  const o = () => ({ namCong: +$("namCong").value });
  KCNum.attach($("val"), { decimals: 4 });
  function units(){
    const r = $("region").value, keep = $("unit").value;
    $("congL").hidden = $("congW").hidden = r !== "nam";
    const us = DatDai.unitsOf(r, o()).filter(u => u.id !== "km2");
    $("unit").innerHTML = us.map(u => `<option value="${u.id}">${nm(u)}</option>`).join("");
    $("unit").value = us.some(u => u.id === keep) ? keep : (r === "nam" ? "cong" : "sao");
  }
  $("region").addEventListener("change", units);
  units();
  const form = KC.form($("f"), { calc(){
    const v = DatDai.num($("val").value), r = $("region").value, unit = $("unit").value;
    if (v == null) { $("val").focus(); return false; }
    try { localStorage.setItem("kc-dd", JSON.stringify({ region: r, namCong: +$("namCong").value })); } catch (e) {}
    const us = DatDai.unitsOf(r, o()).filter(u => u.id !== "km2"), u = us.find(x => x.id === unit), m2 = DatDai.toM2(v, unit, r, o());
    const where = ["m2", "ha"].includes(unit) ? "" : " " + DatDai.regions(o())[r].name;
    $("res").innerHTML = unit === "m2" ? `${F(v)} m² = <b>${F(m2 / 10000, 4)} ha</b>` : `${F(v)} ${nm(u)}${where} = <b>${F(m2)} m²</b>`;
    $("tbl").innerHTML = us.filter(x => x.id !== unit).map(x => `<tr><td>${nm(x)}${["m2", "ha"].includes(x.id) ? "" : " (" + F(x.m2, 1) + " m²)"}</td><td class="n">${F(m2 / x.m2)}</td></tr>`).join("");
  } });
  form.run(false);
})();
</script>
