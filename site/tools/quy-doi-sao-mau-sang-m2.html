<div class="tool">
  <div class="row">
    <span class="seg" role="group" aria-label="Vùng" id="regions">
      <button type="button" data-r="bac" aria-pressed="true">Bắc Bộ</button><button type="button" data-r="trung" aria-pressed="false">Trung Bộ</button><button type="button" data-r="nam" aria-pressed="false">Nam Bộ</button>
    </span>
    <span class="opt" id="optNam" hidden>1 công =
      <select id="namCong" aria-label="Một công bằng"><option value="1000">1.000 m²</option><option value="1296">1.296 m²</option></select></span>
  </div>
  <div class="field">
    <label class="label" for="val">Diện tích</label>
    <div class="pair">
      <input id="val" class="big" inputmode="decimal" autocomplete="off" value="1">
      <select id="unit" class="big" aria-label="Đơn vị"></select>
    </div>
  </div>
  <div class="out" aria-live="polite">
    <div class="scroll"><table class="t res"><tbody id="tbl"></tbody></table></div>
  </div>
</div>

<div class="article">
  <h2>Bảng quy đổi</h2>
  <div class="scroll"><table class="t">
    <thead><tr><th></th><th>Bắc Bộ</th><th>Trung Bộ</th><th>Nam Bộ</th></tr></thead>
    <tbody>
      <tr><td>1 thước</td><td class="n">24 m²</td><td class="n">≈ 33 m²</td><td>–</td></tr>
      <tr><td>1 sào</td><td class="n">360 m²</td><td class="n">497 m²</td><td>–</td></tr>
      <tr><td>1 mẫu</td><td class="n">3.600 m²</td><td class="n">4.970 m²</td><td>–</td></tr>
      <tr><td>1 công</td><td>–</td><td>–</td><td class="n">1.000 m² (tầm nhỏ)<br>1.296 m² (tầm lớn)</td></tr>
    </tbody>
  </table></div>
  <p class="note">1 ha = 10.000 m². Sổ đỏ ghi diện tích bằng m²; khi mua bán nên chốt theo m².</p>
</div>

<script src="/js/so-nhap.js"></script>
<script src="/js/dat-dai.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id), F = DatDai.fmt;
  const st = { region: "bac", unit: "sao", namCong: 1000 };
  try { Object.assign(st, JSON.parse(localStorage.getItem("kc-dd") || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem("kc-dd", JSON.stringify(st)); } catch (e) {} };
  const o = () => ({ namCong: +st.namCong });
  KCNum.attach($("val"), { decimals: 4 });

  function sync(){
    document.querySelectorAll("#regions button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === st.region)));
    $("optNam").hidden = st.region !== "nam"; $("namCong").value = String(st.namCong);
    const units = DatDai.unitsOf(st.region, o()).filter(u => u.id !== "km2");
    if (!units.some(u => u.id === st.unit)) st.unit = units[0].id;
    $("unit").innerHTML = units.map(u => `<option value="${u.id}">${u.name.replace(/ \(.*\)/, "")}</option>`).join("");
    $("unit").value = st.unit;
  }
  function render(){
    const v = DatDai.num($("val").value);
    if (v == null) { $("tbl").innerHTML = ""; return; }
    const m2 = DatDai.toM2(v, st.unit, st.region, o());
    const units = DatDai.unitsOf(st.region, o()).filter(u => u.id !== st.unit && u.id !== "km2");
    $("tbl").innerHTML = units.map(u => `<tr><td class="n"><b>${F(m2 / u.m2)}</b></td><td>${u.name.replace(/ \(.*\)/, "")}</td></tr>`).join("");
  }
  document.querySelectorAll("#regions button").forEach(b => b.addEventListener("click", () => {
    st.region = b.dataset.r;
    if (!["m2", "ha"].includes(st.unit)) st.unit = st.region === "nam" ? "cong" : "sao";
    sync(); render(); save();
  }));
  $("namCong").addEventListener("change", () => { st.namCong = +$("namCong").value; render(); save(); });
  $("unit").addEventListener("change", () => { st.unit = $("unit").value; render(); save(); });
  $("val").addEventListener("input", render);
  sync(); render();
})();
</script>
