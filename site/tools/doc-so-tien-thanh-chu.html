<div class="tool">
  <div class="field">
    <label class="label" for="num">Số tiền</label>
    <input id="num" class="big" inputmode="decimal" autocomplete="off" value="1250000">
  </div>
  <div class="row">
    <span class="seg" role="group" aria-label="Đọc số 0 ở hàng chục"><button type="button" data-k="linh" data-v="linh" aria-pressed="true">linh</button><button type="button" data-k="linh" data-v="lẻ" aria-pressed="false">lẻ</button></span>
    <span class="seg" role="group" aria-label="Hàng nghìn"><button type="button" data-k="nghin" data-v="nghìn" aria-pressed="true">nghìn</button><button type="button" data-k="nghin" data-v="ngàn" aria-pressed="false">ngàn</button></span>
    <label class="chk"><input type="checkbox" id="chan"> Thêm "chẵn"</label>
  </div>
  <div class="out" aria-live="polite">
    <div class="text" id="res"></div>
    <div class="actions"><button class="btn primary" type="button" data-copy-from="res">Sao chép</button></div>
  </div>
</div>

<div class="article">
  <h2>Quy tắc đọc</h2>
  <ul>
    <li>Số 0 ở hàng chục đọc "linh" hoặc "lẻ": 105 = một trăm linh năm.</li>
    <li>Hàng trăm bằng 0 vẫn đọc "không trăm": 1.005.000 = một triệu không trăm linh năm nghìn.</li>
    <li>21 = hai mươi mốt, 24 = hai mươi tư, 25 = hai mươi lăm, 15 = mười lăm.</li>
    <li>Viết hoa chữ cái đầu, kết thúc bằng "đồng".</li>
  </ul>
</div>

<script src="/js/so-nhap.js"></script>
<script src="/js/so-thanh-chu.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const opts = { linh: "linh", nghin: "nghìn", chan: false };
  try { Object.assign(opts, JSON.parse(localStorage.getItem("kc-stc") || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem("kc-stc", JSON.stringify(opts)); } catch (e) {} };
  KCNum.attach($("num"), { decimals: 2, allowNeg: true });

  function render(){
    const v = $("num").value.trim(), p = SoThanhChu.parse(v), res = $("res");
    res.className = "text" + (v && !p ? " err" : "");
    res.textContent = !v ? "" : p ? SoThanhChu.read(p, opts) : "Số chưa hợp lệ";
  }
  function sync(){
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(opts[b.dataset.k] === b.dataset.v)));
    $("chan").checked = !!opts.chan;
  }
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { opts[b.dataset.k] = b.dataset.v; sync(); render(); save(); }));
  $("chan").addEventListener("change", () => { opts.chan = $("chan").checked; render(); save(); });
  $("num").addEventListener("input", render);
  sync(); render();
})();
</script>
