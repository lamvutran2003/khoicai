<div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
  // Shared: every [data-copy-from] button copies the text of the element it names.
  const toast = msg => { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2000); };
  window.KC_TOAST = toast;
  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-copy-from]"); if (!b) return;
    const el = document.getElementById(b.dataset.copyFrom); if (!el) return;
    const text = "value" in el ? el.value : el.textContent;
    if (!text.trim()) return;
    try { await navigator.clipboard.writeText(text); toast("Đã sao chép"); }
    catch (err) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Đã chọn, bấm Ctrl+C để sao chép"); }
  });
})();
</script>
